services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: online_library
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d online_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: online_library
      DB_USER: pguser
      DB_PASS: pgpassword
      PORT: 4000
      JWT_SECRET: secret123
      DB_SYNC_FORCE: "false"
      DB_SYNC_ALTER: "false"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
